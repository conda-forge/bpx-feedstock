schema_version: 1

context:
  name: bpx
  version: "1.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/bpx-${{ version }}.tar.gz
  sha256: dac34347032be4e40d246b1f0fff54511ea4fb05e1e79f05dc79298badbb584c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - pydantic >=2.6
    - pyparsing
    - pyyaml

tests:
  - python:
      imports:
        - bpx
        - bpx.interpolated_table
        - bpx.expression_parser
        - bpx.function
        - bpx.validators
        - bpx.schema
        - bpx.parsers
        - bpx.utilities
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pip
    script:
      - pip check

about:
  summary: BPX schema and parsers
  license: MIT
  license_file: LICENSE.md
  homepage: https://github.com/FaradayInstitution/BPX
  repository: https://github.com/FaradayInstitution/BPX

extra:
  recipe-maintainers:
    - Saransh-cpp
